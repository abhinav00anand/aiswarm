aiswarm:
  version: "1.3.1"
  environment: development

orchestrator:
  max_concurrent_tasks: 10
  task_timeout: 3600          # seconds
  checkpoint_interval: 60     # seconds
  deadlock_timeout: 300       # seconds
  state_sync_interval: 30

agents:
  boss:
    model: meta-llama/llama-3.1-70b-instruct
    provider: novita
    temperature: 0.1
    max_tokens: 4096
    max_retries: 3
    escalation_threshold: 3   # escalate after 3 deadlocks

  manager:
    model: meta-llama/llama-3.1-70b-instruct
    provider: novita
    temperature: 0.2
    max_tokens: 4096
    max_task_decomposition: 20

  planner:
    model: meta-llama/llama-3.1-405b-instruct
    provider: novita
    temperature: 0.1
    max_tokens: 2048

  context_selector:
    max_files: 15
    max_tokens: 8000
    similarity_threshold: 0.75
    strategy: semantic_plus_structural

  coder:
    model: meta-llama/llama-3.1-405b-instruct
    provider: novita
    temperature: 0.15
    max_tokens: 8192
    max_retries: 5

  precheck:
    model: meta-llama/llama-3.1-8b-instruct
    provider: novita
    temperature: 0.0
    max_tokens: 1024

  critics:
    architecture:
      model: meta-llama/llama-3.1-70b-instruct
      provider: novita
      temperature: 0.1
      max_tokens: 2048
    performance:
      model: meta-llama/llama-3.1-70b-instruct
      provider: novita
      temperature: 0.1
      max_tokens: 2048
    security:
      model: meta-llama/llama-3.1-70b-instruct
      provider: novita
      temperature: 0.0
      max_tokens: 2048

  benchmark:
    model: meta-llama/llama-3.1-8b-instruct
    provider: novita
    temperature: 0.0
    max_tokens: 1024

  documentation:
    model: meta-llama/llama-3.1-70b-instruct
    provider: novita
    temperature: 0.3
    max_tokens: 4096

  optimizer:
    model: meta-llama/llama-3.1-405b-instruct
    provider: novita
    temperature: 0.1
    max_tokens: 8192

review:
  approval_threshold: 2       # need 2/3 critics to approve
  veto_power: true            # single security critic can veto
  max_revision_cycles: 5

worker:
  mode: local                 # local | docker | sandbox
  poll_interval: 5            # seconds
  timeout: 300                # seconds
  max_parallel_jobs: 4
  artifact_hash_validation: true

redis:
  url: redis://localhost:6379/0
  job_queue: aiswarm:jobs
  result_queue: aiswarm:results
  state_key_prefix: aiswarm:state
  lock_timeout: 60
  result_ttl: 3600

storage:
  root: ./storage
  artifacts: ./storage/artifacts
  prompts: ./storage/prompts
  tasks: ./storage/tasks
  logs: ./storage/logs
  benchmarks: ./storage/benchmarks
  vector_db: ./storage/vector_db
  cache: ./storage/cache

rag:
  embedding_model: all-MiniLM-L6-v2
  chunk_size: 512
  chunk_overlap: 64
  top_k: 10
  rerank: true
  cache_embeddings: true

telemetry:
  enabled: true
  log_level: INFO
  log_format: json
  metrics_port: 9090
  tracing_enabled: false
  notification_channel: telegram

security:
  enable_code_sandbox: true
  max_file_size_kb: 1024
  forbidden_imports:
    - os.system
    - subprocess.Popen
    - eval
    - exec
    - __import__
  allowed_languages:
    - python
    - cpp
    - rust
    - javascript
    - typescript

testing:
  timeout: 120
  coverage_threshold: 80
  numeric_tolerance: 1.0e-6
  performance_tolerance: 0.10   # 10% regression allowed
