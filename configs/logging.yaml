version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"
    class: pythonjsonlogger.jsonlogger.JsonFormatter
  colored:
    format: "%(asctime)s | %(levelname)-8s | %(name)-30s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: colored
    stream: ext://sys.stdout
    level: DEBUG

  file_rotating:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: ./storage/logs/zymis.log
    maxBytes: 104857600   # 100 MB
    backupCount: 10
    level: DEBUG

  error_file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: ./storage/logs/errors.log
    maxBytes: 10485760    # 10 MB
    backupCount: 5
    level: ERROR

root:
  level: INFO
  handlers: [console, file_rotating, error_file]

loggers:
  zymis:
    level: DEBUG
    propagate: true
  uvicorn:
    level: INFO
    propagate: false
  httpx:
    level: WARNING
    propagate: false
  redis:
    level: WARNING
    propagate: false
  chromadb:
    level: WARNING
    propagate: false
